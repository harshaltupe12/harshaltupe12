name: Refresh activity card

# Manual only: run it from the Actions tab ("Run workflow") when you want fresh numbers.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/activity-card.mjs "${{ github.repository_owner }}" assets/activity.svg
      - name: Commit if changed
        run: |
          git config user.name "Harshal Tupe"
          git config user.email "105987238+harshaltupe12@users.noreply.github.com"
          git add assets/activity.svg assets/activity-mobile.svg
          git diff --cached --quiet || { git commit -m "chore: refresh activity card [skip ci]" && git push; }

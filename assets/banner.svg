<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Welcome to Harshal's GitHub">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8EEF8"/>
      <stop offset="0.5" stop-color="#C9D5EB"/>
      <stop offset="1" stop-color="#93A9D1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7F9FD" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F7F9FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8EEF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8EEF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E8EEF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D5EB"/>
      <stop offset="1" stop-color="#F2F5FB"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#sky)"/>
    <circle cx="600" cy="250" r="150" fill="url(#glow)"/>

    <!-- title -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">
      <text x="600" y="102" font-size="36" font-weight="600" fill="#14213D">Welcome to Harshal's GitHub</text>
      <text x="600" y="140" font-size="14" letter-spacing="4" fill="#2E4A7D">SENIOR SOFTWARE ENGINEER · MUMBAI, INDIA</text>
      <text x="600" y="180" font-size="22" font-weight="600" fill="#2E4A7D">&lt;/&gt;<tspan fill="#14213D">_<animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></tspan></text>
    </g>

    <!-- birds -->
    <g fill="none" stroke="#3F5F99" stroke-width="1.6" stroke-linecap="round">
      <path d="M262 92 q6 -6 12 0 q6 -6 12 0"/>
      <path d="M296 112 q4 -4 8 0 q4 -4 8 0"/>
      <path d="M908 78 q5 -5 10 0 q5 -5 10 0"/>
    </g>

    <!-- mountain layers, far to near -->
    <path fill="#7F98C6" d="M0 252 C70 236 120 228 190 240 C250 250 290 214 360 220 C430 226 470 248 540 238 C600 230 640 216 700 226 C770 238 820 212 890 218 C960 224 1010 246 1080 236 C1130 229 1170 226 1200 230 V400 H0 Z"/>
    <rect y="230" width="1200" height="70" fill="url(#mist)"/>
    <path fill="#4E6CA3" d="M0 290 C120 252 220 256 330 280 C430 302 520 262 600 264 C700 266 780 302 880 286 C980 270 1080 250 1200 276 V400 H0 Z"/>
    <path fill="#2E4A7D" d="M0 330 C150 300 260 310 380 336 C480 356 560 326 640 320 C740 314 820 352 940 346 C1040 340 1120 314 1200 320 V400 H0 Z"/>
    <path fill="#1E2F55" d="M0 368 C200 346 360 358 520 376 C640 390 760 362 900 366 C1040 370 1120 356 1200 362 V400 H0 Z"/>

    <!-- river -->
    <path fill="url(#river)" d="M596 266 C588 284 640 298 612 318 C572 342 520 352 562 376 C592 392 636 396 650 400 L770 400 C724 390 652 382 640 368 C620 350 702 336 682 318 C662 300 616 288 606 266 Z">
      <animate attributeName="opacity" values="0.92;1;0.92" dur="6s" repeatCount="indefinite"/>
    </path>
    <path fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round" d="M604 290 C618 300 630 306 618 318 M590 352 C600 364 620 374 640 382 M676 390 C690 394 706 397 720 398"/>
  </g>
</svg>
